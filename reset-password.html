<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — SaveCode</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --blue:      #0067b8;
      --blue-h:    #005a9e;
      --blue-pale: #e8f1fb;
      --gray-bg:   #f2f2f2;
      --gray-mid:  #e0e0e0;
      --gray-500:  #6b7280;
      --gray-700:  #374151;
      --gray-900:  #111827;
      --white:     #ffffff;
      --green:     #059669;
      --red:       #dc2626;
    }
    body { font-family:'Nunito Sans','Segoe UI',sans-serif; background:var(--gray-bg); color:var(--gray-900); min-height:100vh; display:flex; flex-direction:column; }

    nav { background:var(--white); border-bottom:1px solid var(--gray-mid); height:52px; display:flex; align-items:center; padding:0 32px; }
    .nav-brand { display:flex; align-items:center; text-decoration:none; }

    .page { flex:1; display:flex; align-items:center; justify-content:center; padding:40px 24px; }

    .card {
      background:var(--white); border:1px solid var(--gray-mid);
      padding:40px; width:100%; max-width:440px;
    }

    .card-icon { font-size:40px; text-align:center; margin-bottom:16px; }
    .card h1 { font-size:22px; font-weight:800; color:var(--gray-900); margin-bottom:6px; text-align:center; }
    .card p { font-size:13px; color:var(--gray-500); text-align:center; margin-bottom:28px; line-height:1.6; }

    .form-group { display:flex; flex-direction:column; gap:5px; margin-bottom:14px; }
    label { font-size:11px; font-weight:700; color:var(--gray-700); text-transform:uppercase; letter-spacing:.4px; }

    .pw-wrap { position:relative; }
    .pw-wrap input { width:100%; padding-right:44px; }
    input {
      padding:10px 14px; border:1px solid var(--gray-mid);
      font-size:14px; font-family:inherit; color:var(--gray-900);
      background:var(--white); outline:none; border-radius:2px;
      transition:border-color .2s,box-shadow .2s; width:100%;
    }
    input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(0,103,184,.1); }
    input::placeholder { color:#adb5bd; }

    .pw-toggle {
      position:absolute; right:12px; top:50%; transform:translateY(-50%);
      background:none; border:none; cursor:pointer; color:var(--gray-500);
      padding:4px; display:flex; align-items:center;
    }
    .pw-toggle:hover { color:var(--blue); }

    /* PASSWORD STRENGTH */
    .pw-strength { margin-top:6px; }
    .pw-strength-bar { height:3px; border-radius:2px; background:var(--gray-mid); margin-bottom:4px; overflow:hidden; }
    .pw-strength-fill { height:100%; border-radius:2px; transition:width .3s,background .3s; width:0%; }
    .pw-strength-text { font-size:11px; color:var(--gray-500); }

    .btn {
      width:100%; padding:12px; background:var(--blue); color:var(--white);
      border:none; border-radius:2px; font-size:15px; font-weight:800;
      font-family:inherit; cursor:pointer; transition:background .15s; margin-top:8px;
    }
    .btn:hover { background:var(--blue-h); }
    .btn:disabled { background:var(--gray-mid); cursor:not-allowed; }

    .error-msg { font-size:13px; color:var(--red); margin-bottom:12px; display:none; padding:10px 14px; background:#fef2f2; border:1px solid #fecaca; border-radius:2px; }
    .success-msg { display:none; text-align:center; padding:16px 0; }
    .success-msg .icon { font-size:48px; margin-bottom:12px; }
    .success-msg h2 { font-size:20px; font-weight:800; margin-bottom:8px; }
    .success-msg p { font-size:13px; color:var(--gray-500); margin-bottom:20px; }
    .btn-signin { display:inline-block; background:var(--blue); color:var(--white); padding:11px 28px; border-radius:2px; font-size:14px; font-weight:800; text-decoration:none; }

    footer { background:var(--gray-900); padding:20px 32px; text-align:center; }
    footer p { font-size:12px; color:rgba(255,255,255,.35); }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-brand">
    <svg width="150" height="30" viewBox="0 0 340 90" fill="none">
      <defs>
        <linearGradient id="nhg" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0067b8"/><stop offset="100%" stop-color="#059669"/></linearGradient>
        <linearGradient id="ntg" x1="100" y1="0" x2="340" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0067b8"/><stop offset="100%" stop-color="#059669"/></linearGradient>
      </defs>
      <path d="M38 6L70 6L86 33L70 60L38 60L22 33Z" fill="none" stroke="url(#nhg)" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M54 16L36 30L41 30L41 50L50 50L50 41L58 41L58 50L67 50L67 30L72 30Z" fill="url(#nhg)" opacity=".12"/>
      <path d="M54 16L36 30L41 30L41 50L50 50L50 41L58 41L58 50L67 50L67 30L72 30Z" fill="none" stroke="url(#nhg)" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M54 33L49 35L49 39C49 42 51 44.5 54 46C57 44.5 59 42 59 39L59 35Z" fill="url(#nhg)"/>
      <path d="M52.5 39L53.8 40.5L56.5 37.5" stroke="white" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="100" y="44" font-family="Montserrat,sans-serif" font-size="32" font-weight="800" fill="url(#ntg)" letter-spacing="-0.5">SaveCode</text>
    </svg>
  </a>
</nav>

<div class="page">
  <div class="card">

    <!-- FORM -->
    <div id="reset-form">
      <div class="card-icon">🔑</div>
      <h1>Set New Password</h1>
      <p>Enter your new password below.</p>

      <div class="error-msg" id="error-msg"></div>

      <div class="form-group">
        <label>New Password</label>
        <div class="pw-wrap">
          <input type="password" id="new-pw" placeholder="New password (min 8 chars)" oninput="checkStrength()">
          <button class="pw-toggle" type="button" onclick="togglePw('new-pw','eye1')" id="eye1">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="pw-strength">
          <div class="pw-strength-bar"><div class="pw-strength-fill" id="strength-fill"></div></div>
          <div class="pw-strength-text" id="strength-text"></div>
        </div>
      </div>

      <div class="form-group">
        <label>Confirm New Password</label>
        <div class="pw-wrap">
          <input type="password" id="confirm-pw" placeholder="Repeat new password">
          <button class="pw-toggle" type="button" onclick="togglePw('confirm-pw','eye2')" id="eye2">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <button class="btn" onclick="updatePassword()">Update Password</button>
    </div>

    <!-- SUCCESS -->
    <div class="success-msg" id="success-msg">
      <div class="icon">✅</div>
      <h2>Password Updated!</h2>
      <p>Your password has been changed successfully. You can now sign in with your new password.</p>
      <a href="signin.html" class="btn-signin">Go to Sign In →</a>
    </div>

  </div>
</div>

<footer>
  <p>© 2026 SaveCode · Mangel Technologies LLC</p>
</footer>

<script>
  const SUPABASE_URL = 'https://kpnqaexdqnljzhxnplor.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtwbnFhZXhkcW5sanpoeG5wbG9yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MDE4ODQsImV4cCI6MjA5MjI3Nzg4NH0.XOM-ssOnnOimKATQLnrTLYEqYpOK_NwZdrWhVtVyq8k';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Password toggle
  function togglePw(inputId, btnId) {
    const input = document.getElementById(inputId);
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    document.getElementById(btnId).innerHTML = isHidden
      ? `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
      : `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
  }

  // Password strength
  function checkStrength() {
    const pw = document.getElementById('new-pw').value;
    const fill = document.getElementById('strength-fill');
    const text = document.getElementById('strength-text');
    let score = 0;
    if (pw.length >= 8) score++;
    if (/[A-Z]/.test(pw)) score++;
    if (/[0-9]/.test(pw)) score++;
    if (/[^A-Za-z0-9]/.test(pw)) score++;
    const levels = [
      { pct:'0%', color:'', label:'' },
      { pct:'25%', color:'#dc2626', label:'Weak' },
      { pct:'50%', color:'#d97706', label:'Fair' },
      { pct:'75%', color:'#2563eb', label:'Good' },
      { pct:'100%', color:'#059669', label:'Strong ✓' },
    ];
    fill.style.width = levels[score].pct;
    fill.style.background = levels[score].color;
    text.textContent = levels[score].label;
    text.style.color = levels[score].color;
  }

  // Update password
  async function updatePassword() {
    const pw  = document.getElementById('new-pw').value;
    const cpw = document.getElementById('confirm-pw').value;
    const err = document.getElementById('error-msg');
    const btn = document.querySelector('.btn');

    err.style.display = 'none';

    if (pw.length < 8) { err.textContent = 'Password must be at least 8 characters.'; err.style.display = 'block'; return; }
    if (pw !== cpw) { err.textContent = 'Passwords do not match.'; err.style.display = 'block'; return; }

    btn.textContent = 'Updating...';
    btn.disabled = true;

    const { error } = await sb.auth.updateUser({ password: pw });

    if (error) {
      err.textContent = error.message;
      err.style.display = 'block';
      btn.textContent = 'Update Password';
      btn.disabled = false;
    } else {
      document.getElementById('reset-form').style.display = 'none';
      document.getElementById('success-msg').style.display = 'block';
    }
  }
</script>

</body>
</html>
